  top-3, equal-weight, holds 1 month. Direction-agnostic, broad liquid universe,
  monthly cadence. This is the ONLY design that survived where absolute bets (H7/H8)
  and single-name strategies (gold, H4) failed — because it is relative, broad, and
  regime-robust.

