hypothesis_id: "HYP-008"
version: "1.0"
created_at: "2026-08-05"
status: "retired"  # not_started | testing | passed | failed | retired
author: "Hermes"

name: "G10 FX Carry (real rate-differential, monthly rebalance)"
instrument: ["AUDUSD", "NZDUSD", "GBPUSD", "EURUSD", "USDJPY", "USDCHF", "USDCAD"]
timeframe: "daily -> monthly rebalance"
data_start: "2024-08"
data_end: "2026-08"

claim: >
  Holding the highest interest-rate-differential G10 FX pairs long and the lowest
  short, equal-weight, rebalanced monthly, captures the textbook FX carry premium.

rationale: >
  FX carry is driven by policy-rate differentials. Ranks pairs by the actual
  domestic-foreign rate spread (v0 static snapshot; v1 time-varying history).

entry_rules:
  - "Rank G10 pairs by (USD rate - foreign rate)."
  - "Long top-3 highest carry, short bottom-3 lowest."
  - "Equal weight; hold 1 month; rebalance monthly."

exit_rules:
  - "Monthly rebalance (exit entire book, re-enter new basket)."

stop_rules:
  - "Portfolio-level 4% drawdown halt (repo hard gate)."

position_sizing: "Equal weight across 2N=6 legs; v1 added inverse-vol scaling."

strategy_family: "fx-carry"
tags: ["fx", "carry", "g10", "monthly"]

required_tests:
  - "in_sample_backtest"
  - "out_of_sample_backtest"
  - "walk_forward"
  - "monte_carlo"
  - "cost_realism"

evidence:
  - "v0 (static rate snapshot): trades=138 win=51.4% PF=1.11 Sharpe=0.34 maxDD=2.91% ret=2.24% RR=1.04 MC=69.6%(FAIL) — 0.4% short of MC bar."
  - "v1 (time-varying rates + inverse-vol): trades=138 win=50.0% PF=1.03 Sharpe=0.06 maxDD=5.08% ret=0.61% RR=1.03 MC=54.2%(FAIL) — WORSE than v0."
  - "Bar: PF>1.2 / Sharpe>0.5 / MC>=70% / DD<4%. v1 fails ALL FOUR (DD even breaches the 4% gate)."
  - "Why it failed: 2024-2026 was a broad rate-CUTTING regime. Time-varying carry kept rotating into positions whose differential compressed; inverse-vol sizing did not help in high-vol FX. No edge in this era/sample."

reviewed_by: ""
retired_reason: >
  FAILED the validation bar on both v0 (marginal) and v1 (clear, worse). G10 FX
  carry shows no tradable edge in the 2024-2026 cutting-cycle sample. Retired
  honestly per RESEARCH_PROTOCOL_v1 — not tuned to pass. Only H5 (equity
  momentum) remains proven. TradeLocker FX demo stays read-only (no passing FX
  hypothesis to run on it).
next_action: "CLOSED. Do not retest without new evidence or a materially different market structure / rate regime."
