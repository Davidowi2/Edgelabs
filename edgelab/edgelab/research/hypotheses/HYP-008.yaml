hypothesis_id: "HYP-008"
version: "1.0"
created_at: "2026-08-05"
status: "testing"  # not_started | testing | passed | failed | retired
author: "Hermes"

name: "G10 FX Carry (real rate-differential, monthly rebalance)"
instrument: ["AUDUSD", "NZDUSD", "GBPUSD", "EURUSD", "USDJPY", "USDCHF", "USDCAD"]
timeframe: "daily -> monthly rebalance"
data_start: "2024-08"
data_end: "2026-08"

claim: >
  Holding the highest interest-rate-differential G10 FX pairs long and the lowest
  short, equal-weight, rebalanced monthly, captures the textbook FX carry premium.

rationale: >
  FX carry is driven by policy-rate differentials. Unlike the retired H7 (which used
  a 12M price-return proxy), H8 ranks pairs by the actual domestic-foreign rate
  spread. v0 uses a STATIC rate snapshot; the documented upgrade path is a
  time-varying rate series (FRED/Datastream).

entry_rules:
  - "Rank G10 pairs by (USD rate - foreign rate)."
  - "Long top-3 highest carry, short bottom-3 lowest."
  - "Equal weight; hold 1 month; rebalance monthly."

exit_rules:
  - "Monthly rebalance (exit entire book, re-enter new basket)."

stop_rules:
  - "Portfolio-level 4% drawdown halt (repo hard gate)."

position_sizing: "Equal weight across 2N=6 legs; fractional paper orders."

strategy_family: "fx-carry"
tags: ["fx", "carry", "g10", "monthly"]

required_tests:
  - "in_sample_backtest"
  - "out_of_sample_backtest"
  - "walk_forward"
  - "monte_carlo"
  - "cost_realism"

evidence:
