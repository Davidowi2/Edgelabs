  - "Bar: PF>1.2 (got 1.11) FAIL; Sharpe>0.5 (got 0.34) FAIL; MC>=70% (got 69.6%) FAIL; DD<4% (got 2.91%) PASS"
  - "vs retired H7 (price-proxy): PF 0.74 -> 1.11, DD 9.17% -> 2.91% — real rate signal is materially better."
  - "Marginal fail: 0.4% short of MC bar, Sharpe 0.16 under. Static rate table is the weak link."

